            const emotionsColors = {
                joy: "#FFD400",
                sadness: "#A9CCE3",
                anger: "#8B1E1E",
                fear: "#D2B4DE",
                disgust: "#ABEBC6",
                surprise: "#FAD7A0",
                neutral: "#EAECEE"
            }

            const emotionsEmojis = {
                joy: "😄",
                sadness: "😢",
                anger: "😠",
                fear: "😨",
                disgust: "🤢",
                surprise: "😲",
                neutral: "😐"
            };

            // ===== State variables =====
            let allChats = {};
            let currentChatId = null;
            let currentSearchFilter = null;
            let statsCharts = [];
            let currentStatsIndex = 0;
            let pendingAutoSend = false;
            let menuTargetChatId = null;
            let recognition = null;
            let isRecording = false;
            let currentAbortController = null;
            let tempChat = null;
            let expandedFolders = new Set();
            let authMode = "login";
            let loggedInUsername = null;

            // ===== Functions =====
           function requireLogin() {
                if (loggedInUsername) {
                    return true;
                }
                lockedOverlay.classList.remove("hidden");
                return false;
            }
            function setAuthMode(mode) {
                authMode = mode;
                authError.textContent = "";
                authError.style.color = "";
                authUsername.value = "";
                authEmail.value = "";
                authPassword.value = "";
                authConfirmPassword.value = "";

                if (mode === "login") {
                    authTitle.textContent = "Log In";
                    authSubmitBtn.textContent = "Log In";
                    authToggleText.textContent = "Don't have an account?";
                    authToggleBtn.textContent = "Sign Up";
                    authUsername.closest(".auth-field").style.display = "none";
                    authEmail.closest(".auth-field").style.display = "";
                    authPassword.closest(".auth-field").style.display = "";
                    authConfirmPassword.closest(".auth-field").style.display = "none";
                    authPassword.setAttribute("autocomplete", "current-password");
                } else {
                    authTitle.textContent = "Sign Up";
                    authSubmitBtn.textContent = "Sign Up";
                    authToggleText.textContent = "Already have an account?";
                    authToggleBtn.textContent = "Log In";
                    authUsername.closest(".auth-field").style.display = "";
                    authEmail.closest(".auth-field").style.display = "";
                    authPassword.closest(".auth-field").style.display = "";
                    authConfirmPassword.closest(".auth-field").style.display = "";
                    authPassword.setAttribute("autocomplete", "new-password");
                }
            }
            function openAuthPopup() {
                if (loggedInUsername) {
                    authTitle.textContent = "Log Out?";
                    authUsername.closest(".auth-field").style.display = "none";
                    authEmail.closest(".auth-field").style.display = "none";
                    authPassword.closest(".auth-field").style.display = "none"; 
                    authConfirmPassword.closest(".auth-field").style.display = "none";
                    authError.textContent = "Are you sure you want to log out?";
                    authError.style.color = "#ccc";
                    authSubmitBtn.textContent = "Log Out";
                    authToggleText.style.display = "none";
                    authToggleBtn.style.display = "none";
                    continueGuestBtn.textContent = "Cancel";
                } else {
                    authToggleText.style.display = "";
                    authToggleBtn.style.display = "";
                    continueGuestBtn.textContent = "Continue as Guest →";
                    setAuthMode(authMode);
                }
                authOverlay.classList.remove("hidden");
            }

           function updateGreeting() {
                const h1 = document.querySelector("h1");
                h1.classList.remove("temp-notice");
                h1.textContent = loggedInUsername
                    ? `Hello ${loggedInUsername}, Tell me about your day`
                    : "Hello, Tell me about your day";
            }

            function createEditButton(index, currentText) {
                const editBtn = document.createElement("button");
                editBtn.className = "edit-msg-btn";
                editBtn.textContent = "✏️";
                editBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const wrapper = e.target.closest(".user-message-wrapper");
                    const bubble = wrapper.querySelector(".user-message");
                    startEditingMessage(bubble, index, currentText);
                });
                return editBtn;
            }

            function startEditingMessage(bubble, index, currentText) {
                bubble.innerHTML = "";

                const editInput = document.createElement("textarea");
                editInput.className = "edit-textarea";
                editInput.value = currentText;
                bubble.appendChild(editInput);

                const actionsRow = document.createElement("div");
                actionsRow.className = "edit-actions";

                const confirmBtn = document.createElement("button");
                confirmBtn.className = "edit-action-btn";
                confirmBtn.textContent = "✓";
                confirmBtn.addEventListener("click", () => {
                    const newText = editInput.value.trim();
                    if (newText === "") return;

                    const isTemp = currentChatId === "temp";
                    const messages = isTemp ? tempChat.messages : allChats[currentChatId].messages;
                    messages.length = index;

                    if (!isTemp) {
                        if (index === 0) {
                            allChats[currentChatId].title = "";
                        }
                        saveAllChats();
                    }

                    renderChatOnPage(currentChatId);
                    if (!isTemp) renderChatList();

                    JournalInput.value = newText;
                    sendMessage();
                });

                const cancelBtn = document.createElement("button");
                cancelBtn.className = "edit-action-btn";
                cancelBtn.textContent = "✕";
                cancelBtn.addEventListener("click", () => {
                    renderChatOnPage(currentChatId); 
                });

                actionsRow.appendChild(confirmBtn);
                actionsRow.appendChild(cancelBtn);
                bubble.appendChild(actionsRow);

                editInput.focus();
            }
            function getChatsStorageKey() {
                return loggedInUsername ? `moodRingChats_${loggedInUsername}` : "moodRingChats_guest";
            }
            function getMoodLogStorageKey() {
                return loggedInUsername ? `moodRingMoodLog_${loggedInUsername}` : "moodRingMoodLog_guest";
            }
            function loadAllChats(){
                const saved = localStorage.getItem(getChatsStorageKey());
                allChats = saved ? JSON.parse(saved) : {};
            }
            function saveAllChats(){
                localStorage.setItem(getChatsStorageKey(), JSON.stringify(allChats));
            }
            function renderChatList() {
                chatList.innerHTML = "";
                starredChatList.innerHTML = "";
                folderList.innerHTML = "";

                const allIds = Object.keys(allChats).reverse().filter(id => allChats[id].messages.length > 0);
                const visibleIds = currentSearchFilter ? allIds.filter(id => currentSearchFilter.includes(id)) : allIds;

                const folderedIds = visibleIds.filter(id => allChats[id].folder);
                const unfolderedIds = visibleIds.filter(id => !allChats[id].folder);

                const starredIds = unfolderedIds.filter(id => allChats[id].starred);
                const unstarredIds = unfolderedIds.filter(id => !allChats[id].starred);

                function buildChatItem(chatId) {
                    const item = document.createElement("div");
                    item.className = "chat-list-item" + (chatId === currentChatId ? " active" : "");

                    const titleSpan = document.createElement("span");
                    titleSpan.className = "chat-title";
                    titleSpan.textContent = (allChats[chatId].starred ? "🌟 " : "") + (allChats[chatId].title || "New chat");
                    item.appendChild(titleSpan);

                    const kebabBtn = document.createElement("button");
                    kebabBtn.className = "kebab-btn";
                    kebabBtn.textContent = "⋮";
                    kebabBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        openChatOptionsMenu(chatId, kebabBtn);
                    });
                    item.appendChild(kebabBtn);

                    item.addEventListener("click", () => switchToChat(chatId));
                    return item;
                }
                const folderNames = [...new Set(folderedIds.map(id => allChats[id].folder))].sort();

                folderNames.forEach(function(folderName) {
                    const isExpanded = expandedFolders.has(folderName);

                    const header = document.createElement("div");
                    header.className = "folder-header";

                    const nameSpan = document.createElement("span");
                    nameSpan.className = "folder-header-name";
                    nameSpan.textContent = (isExpanded ? "📂 " : "📁 ") + folderName;
                    header.appendChild(nameSpan);

                    const actions = document.createElement("div");
                    actions.className = "folder-header-actions";

                    const renameBtn = document.createElement("button");
                    renameBtn.className = "folder-action-btn";
                    renameBtn.textContent = "📜";
                    renameBtn.addEventListener("click", async (e) => {
                        e.stopPropagation();
                        const newName = await showPrompt("Rename folder:", folderName);
                        if (newName !== null && newName.trim() !== "") {
                            const trimmedName = newName.trim();
                            Object.values(allChats).forEach(chat => {
                                if (chat.folder === folderName) {
                                    chat.folder = trimmedName;
                                }
                            });
                            if (expandedFolders.has(folderName)) {
                                expandedFolders.delete(folderName);
                                expandedFolders.add(trimmedName);
                            }
                            saveAllChats();
                            renderChatList();
                        }
                    });

                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "folder-action-btn";
                    deleteBtn.textContent = "🧨";
                    deleteBtn.addEventListener("click", async (e) => {
                        e.stopPropagation();
                        const sure = await showConfirm(
                            "Delete folder?",
                            `Your chats won't be deleted — they'll just move back to your regular chat list.`
                        );
                        if (sure) {
                            Object.values(allChats).forEach(chat => {
                                if (chat.folder === folderName) {
                                    chat.folder = null;
                                }
                            });
                            expandedFolders.delete(folderName);
                            saveAllChats();
                            renderChatList();
                        }
                    });

                    actions.appendChild(renameBtn);
                    actions.appendChild(deleteBtn);
                    header.appendChild(actions);

                    header.addEventListener("click", () => {
                        if (isExpanded) {
                            expandedFolders.delete(folderName);
                        } else {
                            expandedFolders.add(folderName);
                        }
                        renderChatList();
                    });
                    folderList.appendChild(header);

                    if (isExpanded) {
                        const contents = document.createElement("div");
                        contents.className = "folder-contents";
                        folderedIds
                            .filter(id => allChats[id].folder === folderName)
                            .forEach(id => contents.appendChild(buildChatItem(id)));
                        folderList.appendChild(contents);
                    }
                });
                starredIds.forEach(chatId => starredChatList.appendChild(buildChatItem(chatId)));
                unstarredIds.forEach(chatId => chatList.appendChild(buildChatItem(chatId)));
            }
            function renderChatOnPage(chatId) {
                chatHistory.innerHTML = "";
                const isTemp = chatId === "temp";
                const messages = isTemp ? tempChat.messages : allChats[chatId].messages;

                const bgColor = isTemp
                    ? (tempChat.lastColor || localStorage.getItem("moodRingDefaultColor") || "rgb(235, 177, 253)")
                    : (allChats[chatId].lastColor || localStorage.getItem("moodRingDefaultColor") || "rgb(235, 177, 253)");
                document.body.style.backgroundColor = bgColor;
                document.body.style.setProperty("--mood-color", bgColor);

                messages.forEach(function(message, index) {
                    if (message.sender === "user") {
                        const wrapper = document.createElement("div");
                        wrapper.className = "user-message-wrapper";
                        const bubble = document.createElement("div");
                        bubble.className = "user-message";
                        bubble.textContent = message.text;
                        wrapper.appendChild(bubble);
                        wrapper.appendChild(createEditButton(index, message.text));
                        chatHistory.appendChild(wrapper);
                   } else {
                        const wrapper = document.createElement("div");
                        wrapper.className = "ai-message-wrapper";

                        const bubble = document.createElement("div");
                        bubble.className = "ai-message";
                        bubble.textContent = message.text;
                        bubble.appendChild(createSpeakButton(message.text));
                        wrapper.appendChild(bubble);

                        if (message.emotion) {
                            wrapper.appendChild(createEmotionBadge(message.emotion, message.confidence));
                        }
                        chatHistory.appendChild(wrapper);
                    }
                });

                if (messages.length > 0) {
                    document.body.classList.add("chat-active");
                } else {
                    document.body.classList.remove("chat-active");
                }
                document.body.style.backgroundColor = bgColor;
            }
            function switchToChat(chatId, shouldCloseSidebar = true) {
                tempChat = null;
                currentChatId = chatId;
                localStorage.setItem("moodRingCurrentChatId", currentChatId);
                renderChatOnPage(chatId);
                updateGreeting(); 
                renderChatList();
                if (shouldCloseSidebar) {
                    closeSidebar();
                }
            }
            function startNewChat(shouldCloseSidebar = true) {
                tempChat = null;
                const newId = "chat_" + Date.now();
                allChats[newId] = { title: "", messages: [] };
                switchToChat(newId, shouldCloseSidebar);
            }
            function startTemporaryChat() {
                tempChat = { messages: [], lastColor: null };
                currentChatId = "temp";
                renderChatOnPage("temp");
                const h1 = document.querySelector("h1");
                h1.textContent = "You're using a Temporary Chat — this conversation won't be saved. So what's on your mind?";
                h1.classList.add("temp-notice");
                renderChatList();
                closeSidebar();
            }
           function addMessage(sender, text) {
                const isTemp = currentChatId === "temp";
                const messages = isTemp ? tempChat.messages : allChats[currentChatId].messages;

                if (sender === "user") {
                    const wrapper = document.createElement("div");
                    wrapper.className = "user-message-wrapper";
                    const bubble = document.createElement("div");
                    bubble.className = "user-message";
                    bubble.textContent = text;
                    wrapper.appendChild(bubble);

                    messages.push({ sender: sender, text: text });
                    wrapper.appendChild(createEditButton(messages.length - 1, text));
                    chatHistory.appendChild(wrapper);

                    if (!isTemp) {
                        saveAllChats();
                        renderChatList();
                    }
                    return bubble;
                } else {
                    const wrapper = document.createElement("div");
                    wrapper.className = "ai-message-wrapper";

                    const bubble = document.createElement("div");
                    bubble.className = "ai-message";
                    if (text === "typing........") {
                        bubble.innerHTML = '<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>';
                    } else {
                        bubble.textContent = text;
                        bubble.appendChild(createSpeakButton(text));
                    }
                    wrapper.appendChild(bubble);
                    chatHistory.appendChild(wrapper);

                    messages.push({ sender: sender, text: text });

                    if (!isTemp) {
                        saveAllChats();
                        renderChatList();
                    }
                    return bubble;
                }
            }
            async function checkAuth() {
                const token = localStorage.getItem("moodRingAuthToken");
                if (!token) {
                    authOverlay.classList.add("hidden");
                    return;
                }
                try {
                    const response = await fetch("http://127.0.0.1:8000/me", {
                        headers: { "Authorization": "Bearer " + token }
                    });
                    if (!response.ok) {
                        localStorage.removeItem("moodRingAuthToken");
                        localStorage.removeItem("moodRingUsername");
                        authOverlay.classList.add("hidden");
                        return;
                    }
                    const data = await response.json();
                    loggedInUsername = data.username;
                    authUsername.value = "";
                    authEmail.value = "";
                    authPassword.value = "";
                    authConfirmPassword.value = "";
                    authOverlay.classList.add("hidden");
                    updateGreeting();
                } catch (error) {
                    authOverlay.classList.add("hidden");
                    console.error("Auth check failed:", error);
                }
            }

            async function sendMessage() {
                const textToAnalyze = JournalInput.value;

                if (textToAnalyze.trim() === "") return;
                if (JournalInput.disabled) return;
                JournalInput.disabled = true;
                sendBtn.style.display = "none";
                stopBtn.style.display = "";

                document.body.classList.add("chat-active");
                JournalInput.value = "";
                JournalInput.style.height = "auto";

                const isTemp = currentChatId === "temp";

                addMessage("user", textToAnalyze);
                const aiBubble = addMessage("ai", "typing........");

                window.scrollTo(0, document.body.scrollHeight);

                currentAbortController = new AbortController();

                try {
                    const response = await fetch("http://127.0.0.1:8000/analyze", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text: textToAnalyze }),
                        signal: currentAbortController.signal
                    });

                    const messages = isTemp ? tempChat.messages : allChats[currentChatId].messages;

                    if (!response.ok) {
                        const errorMsg = "Something went wrong on the server (error " + response.status + ").";
                        aiBubble.textContent = errorMsg;
                        messages[messages.length - 1].text = errorMsg;
                        if (!isTemp) saveAllChats();
                        return;
                    }

                    const data = await response.json();

                    aiBubble.textContent = data.reply;
                    aiBubble.appendChild(createSpeakButton(data.reply));
                    aiBubble.parentElement.appendChild(createEmotionBadge(data.emotion, data.confidence));
                    if (!isTemp && allChats[currentChatId].title === "") {
                        allChats[currentChatId].title = data.title;
                    }
                    messages[messages.length - 1].text = data.reply;
                    messages[messages.length - 1].emotion = data.emotion;
                    messages[messages.length - 1].confidence = data.confidence;

                    if (!isTemp) {
                        const moodLog = JSON.parse(localStorage.getItem(getMoodLogStorageKey()) || "[]");
                        moodLog.push({ emotion: data.emotion, confidence: data.confidence, timestamp: Date.now() });
                        localStorage.setItem(getMoodLogStorageKey(), JSON.stringify(moodLog));
                        saveAllChats();
                        renderChatList();
                    }
                    const newColor = emotionsColors[data.emotion] || "rgb(235, 177, 253)";
                    document.body.style.backgroundColor = newColor;
                    document.body.style.setProperty("--mood-color", newColor);

                    if (isTemp) {
                        tempChat.lastColor = newColor;
                    } else {
                        allChats[currentChatId].lastColor = newColor;
                        allChats[currentChatId].lastEmotion = data.emotion;
                        saveAllChats();
                    }

                    window.scrollTo(0, document.body.scrollHeight);
                } catch (error) {
                    const messages = isTemp ? tempChat.messages : allChats[currentChatId].messages;
                    const errorMsg = error.name === "AbortError"
                        ? "Response stopped."
                        : "Couldn't reach the server — check that your backend is running.";
                    aiBubble.textContent = errorMsg;
                    messages[messages.length - 1].text = errorMsg;
                    if (!isTemp) saveAllChats();
                    console.error("Request error:", error);
                } finally {
                    JournalInput.disabled = false;
                    sendBtn.style.display = "";
                    stopBtn.style.display = "none";
                    currentAbortController = null;
                    JournalInput.focus();
                }
            }
            function createEmotionBadge(emotion, confidence) {
                const badge = document.createElement("span");
                badge.className = "emotion-badge";
                const emoji = emotionsEmojis[emotion] || "";
                badge.textContent = `${emoji} ${emotion} · ${(confidence * 100).toFixed(0)}% confident`;
                return badge;
            }
            function openSidebar() {
                sidebar.classList.add("open");
                sidebarOverlay.classList.add("open");
            }
            function closeSidebar() {
                sidebar.classList.remove("open");
                sidebarOverlay.classList.remove("open");
            }
            function showStatsChart(index) {
                currentStatsIndex = index;
                statsImage.src = statsCharts[index];
            }
            function cleanupEmptyChats() {
                let removedAny = false;
                for (const chatId in allChats) {
                    if (allChats[chatId].messages.length === 0) {
                        delete allChats[chatId];
                        removedAny = true;
                    }
                }
                if (removedAny) {
                    saveAllChats();
                }
            }
            function openChatOptionsMenu(chatId, buttonElement) {
                menuTargetChatId = chatId;

                menuStarBtn.textContent = allChats[chatId].starred ? "🌟 Unstar" : "🌟 Star";

                const rect = buttonElement.getBoundingClientRect();

                chatOptionsMenu.style.top = rect.bottom + 5 + "px";
                chatOptionsMenu.style.left = rect.left + "px";
                chatOptionsMenu.classList.add("open");
            }
            function closeChatOptionsMenu() {
                chatOptionsMenu.classList.remove("open");
                menuTargetChatId = null;
            }
            const commonUrduWords = ["main", "hoon", "hai", "tum", "aap", "ap", "bohot", "acha", "theek", "kya", "kyun", "nahi", "aaj", "kal"];
            function looksLikeUrdu(text) {
                const words = text.toLowerCase().split(/\s+/);
                return words.some(word => commonUrduWords.includes(word));
            }
            function updateAuthButtons() {
                if (loggedInUsername) {
                    authActionBtn.textContent = "🚪";
                    sidebarAuthBtn.textContent = "🚪 Log Out";
                    sidebarAuthBtn.style.borderColor = "#b34a4a";
                    sidebarAuthBtn.style.color = "#ff8080";
                } else {
                    authActionBtn.textContent = "🔑";
                    sidebarAuthBtn.textContent = "🔑 Login / Sign Up";
                    sidebarAuthBtn.style.borderColor = "#555";
                    sidebarAuthBtn.style.color = "white";
                }
                sidebarAuthBtn.onclick = openAuthPopup;
                authActionBtn.onclick = openAuthPopup;
            }
            function showFolderPicker(currentFolder) {
                const existingFolders = [...new Set(
                    Object.values(allChats).map(c => c.folder).filter(Boolean)
                )].sort();

                return new Promise((resolve) => {
                    customPromptTitle.textContent = "Move to folder";
                    customPromptInput.value = currentFolder || "";
                    customPromptInput.placeholder = "Type a new folder name...";

                    const pickerRow = document.createElement("div");
                    pickerRow.id = "folderPickerRow";
                    pickerRow.style.cssText = "display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;";

                    existingFolders.forEach(function(name) {
                        const chip = document.createElement("button");
                        chip.textContent = "📁 " + name;
                        chip.style.cssText = "background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:0.85rem; color:var(--ink);";
                        chip.addEventListener("click", (e) => {
                            e.stopPropagation(); 
                            customPromptInput.value = name;
                        });
                        pickerRow.appendChild(chip);
                    });

                    if (currentFolder) {
                        const removeChip = document.createElement("button");
                        removeChip.textContent = "✕ Remove from folder";
                        removeChip.style.cssText = "background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:0.85rem; color:var(--ember);";
                        removeChip.addEventListener("click", () => {
                            customPromptInput.value = "";
                        });
                        pickerRow.appendChild(removeChip);
                    }

                    customPromptInput.insertAdjacentElement("beforebegin", pickerRow);

                    customPromptModal.classList.add("open");
                    customPromptOverlay.classList.add("open");
                    customPromptInput.focus();

                    function cleanup(result) {
                        pickerRow.remove();
                        customPromptInput.placeholder = "";
                        customPromptModal.classList.remove("open");
                        customPromptOverlay.classList.remove("open");
                        customPromptOkBtn.removeEventListener("click", onOk);
                        customPromptCancelBtn.removeEventListener("click", onCancel);
                        customPromptInput.removeEventListener("keydown", onKeydown);
                        resolve(result);
                    }
                    function onOk() { cleanup(customPromptInput.value); }
                    function onCancel() { cleanup(null); }
                    function onKeydown(e) { if (e.key === "Enter") onOk(); }

                    customPromptOkBtn.addEventListener("click", onOk);
                    customPromptCancelBtn.addEventListener("click", onCancel);
                    customPromptInput.addEventListener("keydown", onKeydown);
                });
            }
            function showPrompt(title, defaultValue = "") {
                return new Promise((resolve) => {
                    customPromptTitle.textContent = title;
                    customPromptInput.value = defaultValue;
                    customPromptModal.classList.add("open");
                    customPromptOverlay.classList.add("open");
                    customPromptInput.focus();

                    function cleanup(result) {
                        customPromptModal.classList.remove("open");
                        customPromptOverlay.classList.remove("open");
                        customPromptOkBtn.removeEventListener("click", onOk);
                        customPromptCancelBtn.removeEventListener("click", onCancel);
                        customPromptInput.removeEventListener("keydown", onKeydown);
                        resolve(result);
                    }
                    function onOk() { cleanup(customPromptInput.value); }
                    function onCancel() { cleanup(null); }
                    function onKeydown(e) { if (e.key === "Enter") onOk(); }

                    customPromptOkBtn.addEventListener("click", onOk);
                    customPromptCancelBtn.addEventListener("click", onCancel);
                    customPromptInput.addEventListener("keydown", onKeydown);
                });
            }

            function showConfirm(title, message, okLabel = "Confirm", showCancel = true) {
                return new Promise((resolve) => {
                    customConfirmTitle.textContent = title;
                    customConfirmMessage.textContent = message;
                    customConfirmOkBtn.textContent = okLabel;
                    customConfirmCancelBtn.style.display = showCancel ? "" : "none";
                    customConfirmModal.classList.add("open");
                    customConfirmOverlay.classList.add("open");

                    function cleanup(result) {
                        customConfirmModal.classList.remove("open");
                        customConfirmOverlay.classList.remove("open");
                        customConfirmOkBtn.removeEventListener("click", onOk);
                        customConfirmCancelBtn.removeEventListener("click", onCancel);
                        resolve(result);
                    }
                    function onOk() { cleanup(true); }
                    function onCancel() { cleanup(false); }

                    customConfirmOkBtn.addEventListener("click", onOk);
                    customConfirmCancelBtn.addEventListener("click", onCancel);
                });
            }

            function showAlert(title, message) {
                return showConfirm(title, message, "OK", false);
            }
            function speakText(text) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = parseFloat(localStorage.getItem("moodRingPitch") || "1");

                if (looksLikeUrdu(text)) {
                    const voices = window.speechSynthesis.getVoices();
                    const urduVoice = voices.find(v => v.lang.startsWith("ur"));
                    if (urduVoice) {
                        utterance.voice = urduVoice;
                        utterance.lang = urduVoice.lang;
                    }
                }

                window.speechSynthesis.speak(utterance);
            }
            function createSpeakButton(text) {
                const speakBtn = document.createElement("button");
                speakBtn.className = "speak-btn";
                speakBtn.textContent = "🔊";
                speakBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    speakText(text);
                });
                return speakBtn;
            }
            function clearSearch() {
                searchInput.value = "";
                currentSearchFilter = null;
                renderChatList();
            }
            function hexToRgbString(hex) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `${r}, ${g}, ${b}`;
            }
            function applyLockState() {
                const lockedButtons = [tempChatBtn, statsBtn, settingsBtn, menuFolderBtn];
                lockedButtons.forEach(function(btn) {
                    if (loggedInUsername) {
                        btn.classList.remove("locked");
                    } else {
                        btn.classList.add("locked");
                    }
                });
            }

            // ===== Speech setup =====
            document.querySelectorAll(".sidebar-label.collapsible").forEach(function(label) {
                const target = document.getElementById(label.dataset.target);
                const arrow = label.querySelector(".label-arrow");

                label.addEventListener("click", () => {
                    target.classList.toggle("collapsed");
                    arrow.classList.toggle("collapsed");
                });
            });

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "en-US";

                recognition.addEventListener("result", (event) => {
                    const transcript = event.results[0][0].transcript;
                    JournalInput.value += (JournalInput.value ? " " : "") + transcript;
                    JournalInput.dispatchEvent(new Event("input"));
                });

                recognition.addEventListener("end", () => {
                    isRecording = false;
                    micBtn.classList.remove("recording");

                    voiceBar.classList.remove("active");
                    JournalInput.style.display = "";
                    sendBtn.style.display = "";
                    micBtn.style.display = "";
                    JournalInput.style.height = "auto";
                    JournalInput.style.height = JournalInput.scrollHeight + "px";

                    if (pendingAutoSend) {
                        pendingAutoSend = false;
                        sendMessage();
                    }
                });

                recognition.addEventListener("error", (event) => {
                    isRecording = false;
                    micBtn.classList.remove("recording");
                    voiceBar.classList.remove("active");
                    JournalInput.style.display = "";
                    sendBtn.style.display = "";
                    micBtn.style.display = "";
                    console.error("Speech recognition error:", event.error);
                });

                micBtn.addEventListener("click", () => {
                    if (isRecording) return;

                    recognition.start();
                    isRecording = true;

                    JournalInput.style.display = "none";
                    sendBtn.style.display = "none";
                    micBtn.style.display = "none";
                    voiceBar.classList.add("active");
                });

                voiceStopBtn.addEventListener("click", () => {
                    recognition.stop();
                });

                voiceSendBtn.addEventListener("click", () => {
                    pendingAutoSend = true;
                    recognition.stop();
                });

                voiceCancelBtn.addEventListener("click", () => {
                    recognition.abort();
                });
            } else {
                micBtn.style.display = "none";
            }

            // ===== Startup =====
            const savedDefaultColor = localStorage.getItem("moodRingDefaultColor");
            if (savedDefaultColor) {
                defaultColorPicker.value = savedDefaultColor;
            }

            const savedBlobColor = localStorage.getItem("moodRingBlobColor");
            if (savedBlobColor) {
                blobColorPicker.value = savedBlobColor;
                document.body.style.setProperty("--blob-color", hexToRgbString(savedBlobColor));
            }

            const savedPitch = localStorage.getItem("moodRingPitch");
            if (savedPitch) {
                pitchSlider.value = savedPitch;
                pitchValue.textContent = parseFloat(savedPitch).toFixed(1);
            }

            (async function initApp() {
                const lastActiveId = localStorage.getItem("moodRingCurrentChatId");
                const savedChats = localStorage.getItem("moodRingChats_" + (localStorage.getItem("moodRingUsername") || "guest"));
                if (savedChats && lastActiveId) {
                    try {
                        const parsed = JSON.parse(savedChats);
                        const savedColor = parsed[lastActiveId]?.lastColor || localStorage.getItem("moodRingDefaultColor");
                        if (savedColor) {
                            document.body.style.backgroundColor = savedColor;
                            document.body.style.setProperty("--mood-color", savedColor);
                        }
                    } catch (e) {}
                }

                const isRefresh = sessionStorage.getItem("moodRingSessionActive");

                if (isRefresh) {
                    await checkAuth();
                } else {
                    authOverlay.classList.add("hidden");
                    loggedInUsername = null;
                }
                applyLockState();
                updateAuthButtons();

                loadAllChats();
                cleanupEmptyChats();
                const lastActiveId2 = localStorage.getItem("moodRingCurrentChatId");

                if (isRefresh && lastActiveId2 && allChats[lastActiveId2]) {
                    currentChatId = lastActiveId2;
                    renderChatOnPage(currentChatId);
                    renderChatList();
                } else {
                    startNewChat();
                }

                sessionStorage.setItem("moodRingSessionActive", "true");
            })();

            // ===== Event listeners =====
            authPassword.addEventListener("animationstart", (e) => {
                if (e.animationName === "onAutoFillStart") {
                    authConfirmPassword.value = authPassword.value;
                }
            });

            menuFolderBtn.addEventListener("click", async () => {
                if (!requireLogin()) return;
                const chatId = menuTargetChatId; 
                closeChatOptionsMenu(); 
                const currentFolder = allChats[chatId].folder || "";
                const newFolder = await showFolderPicker(currentFolder);
                if (newFolder !== null && allChats[chatId]) {
                    const name = newFolder.trim();
                    allChats[chatId].folder = name || null;
                    if (name) expandedFolders.add(name);
                    saveAllChats();
                    renderChatList();
                }
            });

            tempChatBtn.addEventListener("click", () => {
                if (!requireLogin()) return;
                if (currentChatId === "temp") {
                    startNewChat();
                } else {
                    startTemporaryChat();
                }
            });
            
            defaultColorPicker.addEventListener("input", () => {
                const chosenColor = defaultColorPicker.value;
                localStorage.setItem("moodRingDefaultColor", chosenColor);
                if (allChats[currentChatId] && allChats[currentChatId].messages.length === 0) {
                    document.body.style.backgroundColor = chosenColor;
                    document.body.style.setProperty("--mood-color", chosenColor);
                }
            });

            document.addEventListener("click", (e) => {
                if (!chatOptionsMenu.contains(e.target)) {
                    closeChatOptionsMenu(); 
                }
            });

            blobColorPicker.addEventListener("input", () => {
                const chosenHex = blobColorPicker.value;
                localStorage.setItem("moodRingBlobColor", chosenHex);
                document.body.style.setProperty("--blob-color", hexToRgbString(chosenHex));
            });

            pitchSlider.addEventListener("input", () => {
                localStorage.setItem("moodRingPitch", pitchSlider.value);
                pitchValue.textContent = parseFloat(pitchSlider.value).toFixed(1);
            });

            searchClearBtn.addEventListener("click", clearSearch);

            searchInput.addEventListener("keydown", async (event) => {
                if (event.key === "Enter") {
                    const query = searchInput.value.trim();

                    if (query === "") {
                        clearSearch();
                        return;
                    }

                    try {
                        const response = await fetch("http://127.0.0.1:8000/search", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ chats: allChats, query: query })
                        });
                        const data = await response.json();
                        currentSearchFilter = data.matching_chat_ids;
                        renderChatList();
                    } catch (error) {
                        console.error("Search error:", error);
                    }
                }
            });

            statsBtn.addEventListener("click", async () => {
                if (!requireLogin()) return;
                settingsModal.classList.remove("open");
                settingsModalOverlay.classList.remove("open");

                const moodLog = JSON.parse(localStorage.getItem(getMoodLogStorageKey()) || "[]");

                if (moodLog.length === 0) {
                    await showAlert("No mood data yet", "Send a few messages first!");
                    return;
                }

                try {
                    const response = await fetch("http://127.0.0.1:8000/stats", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ entries: moodLog })
                    });

                    const data = await response.json();
                    statsCharts = data.charts;
                    showStatsChart(0);

                    statsModal.classList.add("open");
                    statsModalOverlay.classList.add("open");
                } catch (error) {
                    await showAlert("Couldn't generate stats", "Something went wrong — try again in a moment.");
                    console.error(error);
                }
            });

            statsPrevBtn.addEventListener("click", () => {
                const newIndex = (currentStatsIndex - 1 + statsCharts.length) % statsCharts.length;
                showStatsChart(newIndex);
            });

            statsNextBtn.addEventListener("click", () => {
                const newIndex = (currentStatsIndex + 1) % statsCharts.length;
                showStatsChart(newIndex);
            });

            statsModalOverlay.addEventListener("click", () => {
                statsModal.classList.remove("open");
                statsModalOverlay.classList.remove("open");
            });

            statsModalClose.addEventListener("click", () => {
                statsModal.classList.remove("open");
                statsModalOverlay.classList.remove("open");
            });

            settingsBtn.addEventListener("click", () => {
                if (!requireLogin()) return;
                settingsModal.classList.add("open");
                settingsModalOverlay.classList.add("open");
                closeSidebar();
            });

            settingsModalOverlay.addEventListener("click", () => {
                settingsModal.classList.remove("open");
                settingsModalOverlay.classList.remove("open");
            });

            settingsModalClose.addEventListener("click", () => {
                settingsModal.classList.remove("open");
                settingsModalOverlay.classList.remove("open");
            });

            continueGuestBtn.addEventListener("click", () => {
                if (loggedInUsername) {
                    authOverlay.classList.add("hidden");
                    return;
                }
                authOverlay.classList.add("hidden");
                checkAuth().then(() => {
                    applyLockState();
                    updateAuthButtons();
                });
            });

            menuStarBtn.addEventListener("click", () => {
                allChats[menuTargetChatId].starred = !allChats[menuTargetChatId].starred;
                saveAllChats();
                renderChatList();
                closeChatOptionsMenu();
            });

            menuRenameBtn.addEventListener("click", async () => {
                const newTitle = await showPrompt("Rename this chat:", allChats[menuTargetChatId].title);
                if (newTitle !== null && newTitle.trim() !== "") {
                    allChats[menuTargetChatId].title = newTitle.trim();
                    saveAllChats();
                    renderChatList();
                }
                closeChatOptionsMenu();
            });

           menuDeleteBtn.addEventListener("click", async () => {
                const sure = await showConfirm(
                    "Delete chat?",
                    "This conversation will be permanently deleted. This can't be undone."
                );
                if (sure) {
                    const deletedId = menuTargetChatId;
                    delete allChats[deletedId];
                    saveAllChats();

                    if (deletedId === currentChatId) {
                        const remainingIds = Object.keys(allChats);
                        if (remainingIds.length > 0) {
                            switchToChat(remainingIds[remainingIds.length - 1], false);
                        } else {
                            startNewChat(false);
                        }
                    } else {
                        renderChatList();
                    }
                }
                closeChatOptionsMenu();
            });

            document.addEventListener("click", (e) => {
                if (!chatOptionsMenu.contains(e.target)) {
                    closeChatOptionsMenu();
                }
            });

            document.addEventListener("mousemove", (event) => {
                mouseBlob.style.left = event.clientX + "px";
                mouseBlob.style.top = event.clientY + "px";
            });

            sidebarToggle.addEventListener("click", openSidebar);
            sidebarOverlay.addEventListener("click", closeSidebar);
            newChatBtn.addEventListener("click", startNewChat);

            JournalInput.addEventListener("input", function() {
                this.style.height = "auto";
                this.style.height = this.scrollHeight + "px";
            });

            JournalInput.addEventListener("keydown", (event) => {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener("click", sendMessage);

            const togglePasswordBtn = document.getElementById("togglePasswordBtn");
            const toggleConfirmPasswordBtn = document.getElementById("toggleConfirmPasswordBtn");

            togglePasswordBtn.addEventListener("click", () => {
                const isHidden = authPassword.type === "password";
                authPassword.type = isHidden ? "text" : "password";
                togglePasswordBtn.textContent = isHidden ? "🙈" : "👁";
            });

            toggleConfirmPasswordBtn.addEventListener("click", () => {
                const isHidden = authConfirmPassword.type === "password";
                authConfirmPassword.type = isHidden ? "text" : "password";
                toggleConfirmPasswordBtn.textContent = isHidden ? "🙈" : "👁";
            });

            stopBtn.addEventListener("click", () => {
                if (currentAbortController) {
                    currentAbortController.abort();
                }
            });

            authToggleBtn.addEventListener("click", () => {
                setAuthMode(authMode === "login" ? "signup" : "login");
            });

            lockedYesBtn.addEventListener("click", () => {
            lockedOverlay.classList.add("hidden");
                openAuthPopup(); 
            });

            lockedCancelBtn.addEventListener("click", () => {
                lockedOverlay.classList.add("hidden");
            });

            authSubmitBtn.addEventListener("click", async () => {
                if (loggedInUsername) {
                    localStorage.removeItem("moodRingAuthToken");
                    localStorage.removeItem("moodRingUsername");
                    loggedInUsername = null;
                    loadAllChats();
                    startNewChat();
                    authOverlay.classList.add("hidden");
                    document.querySelector("h1").textContent = "Hello, Tell me about your day";
                    applyLockState();
                    updateAuthButtons();
                    return;
                }

               const password = authPassword.value;
                if (authMode === "signup") {
                    const username = authUsername.value.trim();
                    const email = authEmail.value.trim();
                    const confirmPassword = authConfirmPassword.value;

                    if (!username || !email || !password || !confirmPassword) {
                        authError.textContent = "Please fill in all fields.";
                        return;
                    }
                    if (!/^\S+@\S+\.\S+$/.test(email)) {
                        authError.textContent = "Please enter a valid email.";
                        return;
                    }
                    if (password !== confirmPassword) {
                        authError.textContent = "Passwords don't match.";
                        return;
                    }
                } else {
                    const email = authEmail.value.trim();
                    if (!email || !password) {
                        authError.textContent = "Please fill in both fields.";
                        return;
                    }
                }

                const endpoint = authMode === "login" ? "/login" : "/signup";
                const payload = authMode === "signup"
                    ? { username: authUsername.value.trim(), email: authEmail.value.trim(), password }
                    : { email: authEmail.value.trim(), password };

                try {
                    const response = await fetch("http://127.0.0.1:8000" + endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        authError.textContent = data.detail || "Something went wrong.";
                        return;
                    }

                    localStorage.setItem("moodRingAuthToken", data.token);
                    localStorage.setItem("moodRingUsername", data.username);
                    loggedInUsername = data.username;
                    loadAllChats();
                    startNewChat();
                    authOverlay.classList.add("hidden");
                    updateGreeting();
                    applyLockState();
                    updateAuthButtons();
                } catch (error) {
                    authError.textContent = "Couldn't reach the server.";
                    console.error(error);
                }
            });
        </script>
    </body>
</html>
