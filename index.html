<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Mood Ring Journal</title>
       <style>
            /* ---------- Tokens ---------- */
            :root {
                /* Set by JS — do not rename */
                --mood-color: rgb(235, 177, 253);
                --blob-color: 255, 255, 255;
            
                /* Surfaces */
                --ink: #17171b;
                --ink-soft: #212129;
                --ink-lift: #2b2b34;
                --paper: #faf9f6;
                --paper-dim: #efeee9;
            
                /* Hairlines */
                --line: rgba(23, 23, 27, 0.14);
                --line-strong: rgba(23, 23, 27, 0.26);
                --line-dark: rgba(250, 249, 246, 0.10);
                --line-dark-strong: rgba(250, 249, 246, 0.20);
            
                /* Text on dark surfaces */
                --on-dark: #f3f2ee;
                --on-dark-soft: #b9b7b0;
                --on-dark-faint: #85837c;
            
                /* Accents */
                --brass: #b08968;
                --brass-dark: #94704f;
                --brass-tint: rgba(176, 137, 104, 0.16);
                --ember: #b3503f;
                --ember-tint: rgba(179, 80, 63, 0.14);
            
                /* Type */
                --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
                --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            
                /* Radii — one scale, applied by hierarchy */
                --r-xs: 6px;
                --r-sm: 8px;
                --r-md: 11px;
                --r-lg: 16px;
                --r-xl: 20px;
            
                /* Elevation — reserved for things that float */
                --shadow-pop: 0 6px 20px rgba(10, 10, 14, 0.22);
                --shadow-modal: 0 24px 60px rgba(10, 10, 14, 0.34);
            
                --ease: cubic-bezier(0.32, 0.72, 0, 1);
            }
            
            * {
                box-sizing: border-box;
            }
            
            /* ---------- Base ---------- */
            body {
                font-family: var(--font-ui);
                font-size: 16px;
                color: var(--ink);
                background-color: rgb(235, 177, 253);
                transition: background-color 1.1s var(--ease);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
            }
            
            body.chat-active {
                justify-content: flex-end;
                padding-bottom: 148px;
            }
            
            input,
            textarea,
            button {
                font-family: inherit;
                font-size: inherit;
                color: inherit;
            }
            
            button {
                font-feature-settings: "kern";
            }
            
            /* Visible keyboard focus everywhere, invisible to mouse users */
            :focus-visible {
                outline: 2px solid var(--brass);
                outline-offset: 2px;
                border-radius: var(--r-xs);
            }
            
            /* ---------- Greeting ---------- */
            h1 {
                font-family: var(--font-display);
                font-size: clamp(1.9rem, 4.5vw, 2.6rem);
                font-weight: 400;
                letter-spacing: -0.015em;
                line-height: 1.25;
                max-width: 22ch;
                margin: 0 0 2.25rem;
                padding: 0 24px;
                text-align: center;
                text-wrap: balance;
                opacity: 1;
                height: auto;
                transition: opacity 0.45s var(--ease), height 0.45s var(--ease), margin 0.45s var(--ease);
            }
            
            body.chat-active h1 {
                opacity: 0;
                height: 0;
                margin: 0;
                overflow: hidden;
            }
            
            h1.temp-notice {
                font-size: clamp(1.15rem, 2.6vw, 1.4rem);
                font-family: var(--font-ui);
                font-weight: 400;
                line-height: 1.5;
                max-width: 52ch;
                color: rgba(23, 23, 27, 0.72);
            }
            
            /* ---------- Composer ---------- */
            .chat-container {
                width: 100%;
                max-width: 680px;
                position: relative;
            }
            
            .input-bar {
                display: flex;
                justify-content: center;
                width: 100%;
            }
            
            body.chat-active .input-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 52px 20px 22px;
                background: linear-gradient(
                    to top,
                    var(--mood-color) 0%,
                    var(--mood-color) 58%,
                    transparent 100%
                );
                transition: background-color 1.1s var(--ease);
                z-index: 15;
            }
            
            #JournalInput {
                width: 100%;
                padding: 17px 96px 17px 20px;
                font-size: 1rem;
                line-height: 1.55;
                border-radius: var(--r-lg);
                border: 1px solid var(--line-dark);
                background-color: var(--ink-soft);
                color: var(--on-dark);
                outline: none;
                resize: none;
                overflow-y: hidden;
                box-shadow: var(--shadow-pop);
                transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
            }
            
            #JournalInput::placeholder {
                color: var(--on-dark-faint);
            }
            
            #JournalInput:focus {
                border-color: var(--brass);
                box-shadow: var(--shadow-pop), 0 0 0 3px var(--brass-tint);
            }
            
            #JournalInput:disabled {
                opacity: 0.6;
            }
            
            .send-btn {
                position: absolute;
                right: 9px;
                top: 50%;
                transform: translateY(-50%);
                width: 38px;
                height: 38px;
                border-radius: var(--r-md);
                border: none;
                background-color: var(--brass);
                color: #1a1510;
                cursor: pointer;
                font-size: 0.9rem;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background-color 0.18s var(--ease);
            }
            
            .send-btn:hover {
                background-color: var(--brass-dark);
            }
            
            .stop-btn {
                background-color: var(--ember);
                color: #fff;
            }
            
            .stop-btn:hover {
                background-color: #9a4234;
            }
            
            .mic-btn {
                position: absolute;
                right: 55px;
                top: 50%;
                transform: translateY(-50%);
                width: 38px;
                height: 38px;
                border-radius: var(--r-md);
                border: 1px solid var(--line-dark);
                background-color: transparent;
                color: var(--on-dark-soft);
                cursor: pointer;
                font-size: 0.9rem;
                transition: background-color 0.18s var(--ease), border-color 0.18s var(--ease), color 0.18s var(--ease);
            }
            
            .mic-btn:hover {
                background-color: rgba(255, 255, 255, 0.07);
                border-color: var(--line-dark-strong);
                color: var(--on-dark);
            }
            
            .mic-btn.recording {
                background-color: var(--ember);
                border-color: var(--ember);
                color: #fff;
                animation: mic-pulse 1.6s ease-in-out infinite;
            }
            
            @keyframes mic-pulse {
                0%, 100% { box-shadow: 0 0 0 0 rgba(179, 80, 63, 0.45); }
                50%      { box-shadow: 0 0 0 7px rgba(179, 80, 63, 0); }
            }
            
            /* ---------- Voice bar ---------- */
            .voice-bar {
                display: none;
                align-items: center;
                gap: 14px;
                width: 100%;
                max-width: 680px;
                padding: 13px 16px;
                border-radius: var(--r-lg);
                background-color: var(--ink-soft);
                border: 1px solid var(--line-dark);
                box-shadow: var(--shadow-pop);
            }
            
            .voice-bar.active {
                display: flex;
            }
            
            .voice-waveform {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
                height: 22px;
            }
            
            .voice-waveform span {
                width: 3px;
                height: 100%;
                background-color: var(--brass);
                border-radius: 2px;
                animation: waveform-bounce 1.1s ease-in-out infinite;
            }
            
            .voice-waveform span:nth-child(1)  { animation-delay: 0s; }
            .voice-waveform span:nth-child(2)  { animation-delay: 0.1s; }
            .voice-waveform span:nth-child(3)  { animation-delay: 0.2s; }
            .voice-waveform span:nth-child(4)  { animation-delay: 0.3s; }
            .voice-waveform span:nth-child(5)  { animation-delay: 0.4s; }
            .voice-waveform span:nth-child(6)  { animation-delay: 0.5s; }
            .voice-waveform span:nth-child(7)  { animation-delay: 0.4s; }
            .voice-waveform span:nth-child(8)  { animation-delay: 0.3s; }
            .voice-waveform span:nth-child(9)  { animation-delay: 0.2s; }
            .voice-waveform span:nth-child(10) { animation-delay: 0.1s; }
            
            @keyframes waveform-bounce {
                0%, 100% { transform: scaleY(0.25); opacity: 0.6; }
                50%      { transform: scaleY(1); opacity: 1; }
            }
            
            .voice-btn {
                width: 38px;
                height: 38px;
                border-radius: var(--r-md);
                border: 1px solid var(--line-dark);
                background-color: transparent;
                color: var(--on-dark);
                cursor: pointer;
                font-size: 0.9rem;
                flex-shrink: 0;
                transition: background-color 0.18s var(--ease), border-color 0.18s var(--ease);
            }
            
            .voice-btn:hover {
                background-color: rgba(255, 255, 255, 0.07);
                border-color: var(--line-dark-strong);
            }
            
            .voice-send {
                background-color: var(--brass);
                color: #1a1510;
                border-color: var(--brass);
            }
            
            .voice-send:hover {
                background-color: var(--brass-dark);
                border-color: var(--brass-dark);
            }
            
            /* ---------- Transcript ---------- */
            #chatHistory {
                width: 100%;
                max-width: 680px;
                display: flex;
                flex-direction: column;
                gap: 18px;
                margin-bottom: 24px;
            }
            
            body.chat-active #chatHistory {
                margin-top: 104px;
            }
            
            .user-message-wrapper {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                align-self: flex-end;
                max-width: 78%;
            }
            
            .user-message {
                background-color: var(--ink);
                color: var(--on-dark);
                padding: 13px 18px;
                border-radius: var(--r-lg) var(--r-xs) var(--r-lg) var(--r-lg);
                line-height: 1.55;
                box-shadow: 0 2px 8px rgba(10, 10, 14, 0.14);
            }
            
            .ai-message-wrapper {
                display: flex;
                align-items: flex-end;
                gap: 10px;
                align-self: flex-start;
                max-width: 92%;
            }
            
            .ai-message {
                align-self: flex-start;
                background-color: rgba(23, 23, 27, 0.78);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                color: var(--on-dark);
                padding: 13px 18px;
                border-radius: var(--r-xs) var(--r-lg) var(--r-lg) var(--r-lg);
                max-width: 480px;
                line-height: 1.6;
                box-shadow: 0 2px 8px rgba(10, 10, 14, 0.12);
            }
            
            .emotion-badge {
                font-size: 0.72rem;
                color: rgba(23, 23, 27, 0.62);
                background: rgba(255, 255, 255, 0.5);
                border: 1px solid rgba(23, 23, 27, 0.08);
                border-radius: 999px;
                padding: 4px 10px;
                white-space: nowrap;
                flex-shrink: 0;
                margin-bottom: 2px;
            }
            
            .speak-btn {
                display: block;
                margin-top: 10px;
                background: none;
                border: none;
                color: rgba(243, 242, 238, 0.5);
                cursor: pointer;
                font-size: 0.8rem;
                padding: 2px 4px;
                transition: color 0.18s var(--ease);
            }
            
            .speak-btn:hover {
                color: var(--on-dark);
            }
            
            .edit-msg-btn {
                background: none;
                border: none;
                color: rgba(23, 23, 27, 0.5);
                cursor: pointer;
                font-size: 0.78rem;
                padding: 3px 5px;
                margin-top: 5px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.18s var(--ease), color 0.18s var(--ease);
            }
            
            .user-message-wrapper:hover .edit-msg-btn,
            .edit-msg-btn:focus-visible {
                opacity: 1;
                pointer-events: auto;
            }
            
            .edit-msg-btn:hover {
                color: var(--ink);
            }
            
            .edit-textarea {
                width: 100%;
                min-height: 72px;
                background: rgba(0, 0, 0, 0.28);
                border: 1px solid var(--line-dark-strong);
                border-radius: var(--r-sm);
                color: var(--on-dark);
                padding: 10px 12px;
                line-height: 1.55;
                resize: vertical;
                outline: none;
            }
            
            .edit-textarea:focus {
                border-color: var(--brass);
            }
            
            .edit-actions {
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                margin-top: 8px;
            }
            
            .edit-action-btn {
                background: none;
                border: 1px solid var(--line-dark);
                border-radius: var(--r-xs);
                color: var(--on-dark);
                cursor: pointer;
                font-size: 0.82rem;
                padding: 4px 10px;
                transition: background-color 0.18s var(--ease), border-color 0.18s var(--ease);
            }
            
            .edit-action-btn:hover {
                background-color: rgba(255, 255, 255, 0.09);
                border-color: var(--line-dark-strong);
            }
            
            .typing-dots span {
                animation: blink 1.4s infinite both;
            }
            .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
            .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
            
            @keyframes blink {
                0%, 80%, 100% { opacity: 0.2; }
                40%           { opacity: 1; }
            }
            
            /* ---------- Sidebar ---------- */
            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(10, 10, 14, 0.45);
                backdrop-filter: blur(3px);
                -webkit-backdrop-filter: blur(3px);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.28s var(--ease);
                z-index: 20;
            }
            
            .sidebar-overlay.open {
                opacity: 1;
                pointer-events: auto;
            }
            
            .sidebar {
                position: fixed;
                top: 0;
                left: -280px;
                width: 260px;
                height: 100vh;
                background-color: var(--ink);
                color: var(--on-dark);
                padding: 18px 14px;
                transition: left 0.3s var(--ease);
                z-index: 21;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border-right: 1px solid var(--line-dark);
            }
            
            .sidebar.open {
                left: 0;
                box-shadow: var(--shadow-modal);
            }
            
            .sidebar-scroll {
                flex: 1;
                overflow-y: auto;
                min-height: 0;
                scrollbar-width: thin;
                scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
            }
            
            .sidebar-scroll::-webkit-scrollbar { width: 8px; }
            .sidebar-scroll::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
            .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
            .sidebar-scroll::-webkit-scrollbar-thumb {
                background-color: rgba(255, 255, 255, 0.14);
                border-radius: 4px;
            }
            .sidebar-scroll:hover::-webkit-scrollbar-thumb {
                background-color: rgba(255, 255, 255, 0.24);
            }
            
            #sidebarAuthBtn {
                flex-shrink: 0;
                margin-bottom: 0;
                border-top: 1px solid var(--line-dark);
                border-radius: var(--r-md);
                padding-top: 12px;
            }
            
            .search-wrapper {
                position: relative;
                margin-bottom: 14px;
                flex-shrink: 0;
            }
            
            .search-input {
                width: 100%;
                padding: 10px 13px;
                border-radius: var(--r-md);
                border: 1px solid var(--line-dark);
                background-color: var(--ink-soft);
                color: var(--on-dark);
                margin-bottom: 10px;
                font-size: 0.9rem;
                outline: none;
                transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
            }
            
            .search-input::placeholder {
                color: var(--on-dark-faint);
            }
            
            .search-input:focus {
                border-color: var(--brass);
                box-shadow: 0 0 0 3px var(--brass-tint);
            }
            
            .search-wrapper .search-input {
                margin-bottom: 0;
                padding-right: 34px;
            }
            
            .search-clear-btn {
                position: absolute;
                right: 6px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: var(--on-dark-faint);
                cursor: pointer;
                font-size: 0.72rem;
                padding: 6px;
                border-radius: var(--r-xs);
                transition: color 0.18s var(--ease), background-color 0.18s var(--ease);
            }
            
            .search-clear-btn:hover {
                color: var(--on-dark);
                background-color: rgba(255, 255, 255, 0.08);
            }
            
            /* Secondary buttons. Default = dark surfaces; re-scoped for light modals below. */
            .new-chat-btn {
                width: 100%;
                padding: 10px 12px;
                border-radius: var(--r-md);
                border: 1px solid var(--line-dark);
                background-color: transparent;
                color: var(--on-dark);
                cursor: pointer;
                font-size: 0.9rem;
                text-align: center;
                margin-bottom: 8px;
                transition: background-color 0.18s var(--ease), border-color 0.18s var(--ease);
            }
            
            .new-chat-btn:hover {
                background-color: rgba(255, 255, 255, 0.07);
                border-color: var(--line-dark-strong);
            }
            
            .sidebar-label {
                font-size: 0.74rem;
                letter-spacing: 0.01em;
                color: var(--on-dark-faint);
                margin: 20px 0 8px 2px;
                font-weight: 600;
            }
            
            .sidebar-label.collapsible {
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: pointer;
                padding: 4px 2px;
                border-radius: var(--r-xs);
                transition: color 0.18s var(--ease);
            }
            
            .sidebar-label.collapsible:hover {
                color: var(--on-dark-soft);
            }
            
            .label-arrow {
                font-size: 0.6rem;
                color: var(--on-dark-faint);
                transition: transform 0.24s var(--ease);
            }
            
            .label-arrow.collapsed {
                transform: rotate(-90deg);
            }
            
            .collapsible-content {
                overflow: hidden;
                max-height: 2000px;
                transition: max-height 0.3s var(--ease);
            }
            
            .collapsible-content.collapsed {
                max-height: 0;
            }
            
            .chat-list-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 9px 10px;
                border-radius: var(--r-sm);
                cursor: pointer;
                margin-bottom: 2px;
                font-size: 0.875rem;
                color: var(--on-dark-soft);
                border-left: 2px solid transparent;
                transition: background-color 0.18s var(--ease), color 0.18s var(--ease), border-color 0.18s var(--ease);
            }
            
            .chat-list-item:hover {
                background-color: rgba(255, 255, 255, 0.05);
                color: var(--on-dark);
            }
            
            .chat-list-item.active {
                background-color: rgba(255, 255, 255, 0.08);
                border-left-color: var(--brass);
                color: var(--on-dark);
            }
            
            .chat-title {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                flex: 1;
                margin-right: 6px;
            }
            
            .kebab-btn {
                background: none;
                border: none;
                color: var(--on-dark-faint);
                cursor: pointer;
                font-size: 1rem;
                line-height: 1;
                padding: 3px 6px;
                border-radius: var(--r-xs);
                flex-shrink: 0;
                opacity: 0;
                transition: opacity 0.18s var(--ease), background-color 0.18s var(--ease), color 0.18s var(--ease);
            }
            
            .chat-list-item:hover .kebab-btn,
            .chat-list-item.active .kebab-btn,
            .kebab-btn:focus-visible {
                opacity: 1;
            }
            
            .kebab-btn:hover {
                background-color: rgba(255, 255, 255, 0.1);
                color: var(--on-dark);
            }
            
            /* ---------- Folders ---------- */
            .folder-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 6px;
                padding: 9px 10px;
                border-radius: var(--r-sm);
                cursor: pointer;
                margin-bottom: 2px;
                font-size: 0.875rem;
                color: var(--on-dark-soft);
                transition: background-color 0.18s var(--ease), color 0.18s var(--ease);
            }
            
            .folder-header:hover {
                background-color: rgba(255, 255, 255, 0.05);
                color: var(--on-dark);
            }
            
            .folder-header-name {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            
            .folder-header-actions {
                display: flex;
                gap: 1px;
                opacity: 0;
                transition: opacity 0.18s var(--ease);
                flex-shrink: 0;
            }
            
            .folder-header:hover .folder-header-actions,
            .folder-header:focus-within .folder-header-actions {
                opacity: 1;
            }
            
            .folder-action-btn {
                background: none;
                border: none;
                color: var(--on-dark-faint);
                cursor: pointer;
                font-size: 0.78rem;
                padding: 3px 5px;
                border-radius: var(--r-xs);
                transition: background-color 0.18s var(--ease), color 0.18s var(--ease);
            }
            
            .folder-action-btn:hover {
                background-color: rgba(255, 255, 255, 0.1);
                color: var(--on-dark);
            }
            
            .folder-contents {
                padding-left: 12px;
                margin: 2px 0 6px;
                border-left: 1px solid var(--line-dark);
                margin-left: 12px;
            }
            
            /* ---------- Context menu ---------- */
            .chat-options-menu {
                position: fixed;
                background-color: var(--ink-lift);
                border: 1px solid var(--line-dark-strong);
                border-radius: var(--r-md);
                padding: 5px;
                display: none;
                flex-direction: column;
                z-index: 30;
                min-width: 152px;
                box-shadow: var(--shadow-modal);
            }
            
            .chat-options-menu.open {
                display: flex;
            }
            
            .menu-item {
                background: none;
                border: none;
                color: var(--on-dark);
                text-align: left;
                padding: 8px 10px;
                border-radius: var(--r-xs);
                cursor: pointer;
                font-size: 0.875rem;
                transition: background-color 0.15s var(--ease);
            }
            
            .menu-item:hover {

            .menu-item-danger {

            }

                color: #f0a798;
            }
            
            /* ---------- Locked state ---------- */

                opacity: 0.42;
                position: relative;
            }
            
            .locked::after {
                content: "🔒";
                position: absolute;
                right: 11px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 0.75rem;
            }
            
            /* ---------- Floating page buttons ---------- */
            .info-toggle {
                position: fixed;
                top: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                border-radius: var(--r-md);
                border: 1px solid rgba(255, 255, 255, 0.12);
                background-color: rgba(23, 23, 27, 0.6);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                color: var(--on-dark);
                font-size: 1.05rem;
                cursor: pointer;
                z-index: 10;
                box-shadow: 0 2px 10px rgba(10, 10, 14, 0.16);
                transition: background-color 0.18s var(--ease), border-color 0.18s var(--ease);
            }
            
            .info-toggle:hover {
                background-color: rgba(23, 23, 27, 0.78);
                border-color: rgba(255, 255, 255, 0.24);
            }
            
            .info-panel {
                position: fixed;
                top: 75px;
                right: 20px;
                background-color: var(--ink);
                color: var(--on-dark);
                padding: 14px 18px;
                border-radius: var(--r-md);
                font-size: 0.875rem;
                z-index: 10;
                opacity: 0;
                pointer-events: none;
                transform: translateY(-8px);
                box-shadow: var(--shadow-pop);
                transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
            }
            
            .info-panel.open {
                opacity: 1;
                pointer-events: auto;
                transform: translateY(0);
            }
            
            /* ---------- Modals ---------- */

                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0.97);
                background: var(--paper);
                color: var(--ink);
                padding: 16px;
                border-radius: var(--r-xl);
                z-index: 31;
                opacity: 0;
                pointer-events: none;
                border: 1px solid var(--line);
                box-shadow: var(--shadow-modal);
                transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
            }
            
            .stats-modal.open {
                opacity: 1;
                pointer-events: auto;
                transform: translate(-50%, -50%) scale(1);
            }
            
            .stats-modal img {
                max-width: 80vw;
                max-height: 80vh;
                display: block;
                border-radius: var(--r-sm);
            }
            
            .settings-modal.stats-modal {
                text-align: left;
                min-width: 300px;
                max-width: min(420px, 90vw);
                padding: 24px;
            }

            .stats-modal .new-chat-btn {
                color: var(--ink);
                border-color: var(--line);
                text-align: center;
            }
            
            .stats-modal .new-chat-btn:hover {
                background-color: rgba(23, 23, 27, 0.05);
                border-color: var(--line-strong);
            }
            
            .stats-modal .sidebar-label {
                color: rgba(23, 23, 27, 0.5);

            }

                font-weight: 400;
                font-size: 1.3rem;
                letter-spacing: -0.01em;
                margin: 0 0 10px;

            .stats-modal .search-input {
                background-color: #fff;
                border-color: var(--line);
                color: var(--ink);
            }

            }

                position: absolute;
                top: -11px;
                right: -11px;

                height: 30px;

                background-color: var(--ink);
                color: var(--on-dark);
                cursor: pointer;
                font-size: 0.8rem;
                line-height: 1;
                box-shadow: var(--shadow-pop);
                transition: background-color 0.18s var(--ease);

                background-color: var(--ink-lift);
            }

                position: absolute;
                top: 50%;
                transform: translateY(-50%);

                height: 34px;
                border-radius: 50%;

                color: var(--on-dark);

            .color-wheel-input::-moz-color-swatch { border: none; border-radius: 50%; }

                border: 1px solid var(--line-dark);

                font-weight: 400;

                margin-bottom: 14px;

                position: relative;
            }

                padding-right: 42px;
            }
            
            .password-toggle-btn {
                position: absolute;
                right: 6px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                cursor: pointer;
                font-size: 0.9rem;
                color: var(--on-dark-faint);

                border-radius: var(--r-xs);

            }
            
            .password-toggle-btn:hover {
                color: var(--on-dark);
                background-color: rgba(255, 255, 255, 0.07);
            }
            
            .auth-submit-btn {
                width: 100%;
                padding: 12px;
                border-radius: var(--r-md);
                border: 1px solid var(--brass);
                background: var(--brass);
                color: #1a1510;
                cursor: pointer;
                font-size: 0.94rem;
                font-weight: 600;
                margin: 16px 0 4px;
                transition: background-color 0.18s var(--ease), border-color 0.18s var(--ease);
            }
            
            .auth-submit-btn:hover {
                background: var(--brass-dark);
                border-color: var(--brass-dark);
            }
            
            .auth-toggle-text {
                text-align: center;
                font-size: 0.85rem;
                color: var(--on-dark-soft);
                margin: 16px 0 0;
            }
            
            .auth-error {
                color: #e0897a;
                font-size: 0.82rem;
                line-height: 1.45;
                min-height: 1.2em;
                margin: 4px 0 0;
            }
            
            .auth-link-btn {
                background: none;
                border: none;
                color: var(--brass);
                cursor: pointer;
                text-decoration: underline;
                text-underline-offset: 3px;
                font-size: 0.85rem;
                padding: 2px 4px;
                border-radius: var(--r-xs);
                transition: color 0.18s var(--ease);
            }
            
            .auth-link-btn:hover {
                color: #c79d78;
            }
            
            /* Autofill hook — used by JS, keep */
            @keyframes onAutoFillStart {
                from { opacity: 1; }
                to   { opacity: 1; }
            }
            
            input:-webkit-autofill {
                animation-name: onAutoFillStart;
                -webkit-text-fill-color: var(--on-dark);
                box-shadow: 0 0 0 1000px var(--ink) inset;
                caret-color: var(--on-dark);
            }
            
            /* ---------- Cursor glow ---------- */
            .mouse-blob {
                position: fixed;
                top: 0;
                left: 0;
                width: 460px;
                height: 460px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(var(--blob-color), 0.32), transparent 68%);
                pointer-events: none;
                transform: translate(-50%, -50%);
                transition: left 0.22s var(--ease), top 0.22s var(--ease), opacity 0.4s var(--ease);
                filter: blur(44px);
                opacity: 1;
                z-index: 0;
            }
            
            body.chat-active .mouse-blob {
                opacity: 0;
            }
            
            /* ---------- Page scrollbar ---------- */
            body::-webkit-scrollbar { width: 9px; }
            body::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
            body::-webkit-scrollbar-track { background: transparent; }
            body::-webkit-scrollbar-thumb {
                background-color: rgba(23, 23, 27, 0.18);
                border-radius: 5px;
            }
            body::-webkit-scrollbar-thumb:hover {
                background-color: rgba(23, 23, 27, 0.3);
            }
            
            /* ---------- Responsive ---------- */
            @media (max-width: 600px) {
                h1 {
                    font-size: 1.65rem;
                    max-width: 18ch;
                }
            
                .sidebar {
                    width: 85vw;
                    left: -85vw;
                }
            
                .chat-container {
                    padding: 0 10px;
                }
            
                .user-message-wrapper,
                .ai-message-wrapper {
                    max-width: 92%;
                }
            
                .ai-message {
                    max-width: 100%;
                }
            
                .settings-modal.stats-modal {
                    min-width: 0;
                    width: calc(100vw - 40px);
                }
            }
            
            @media (hover: none) {
                .mouse-blob {
                    display: none;
                }
            
                .kebab-btn,
                .edit-msg-btn,
                .folder-header-actions {
                    opacity: 1;
                    pointer-events: auto;
                }
            }
            
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
